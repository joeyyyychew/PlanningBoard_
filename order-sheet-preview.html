<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Key-In</title>
  <style>
    :root {
      --ink:#2a1419;
      --muted:#8f7379;
      --wine:#6f1027;
      --wine-dark:#2a0610;
      --rose:#b94f62;
      --gold:#c99a45;
      --cream:#fbf4ef;
      --card:rgba(255,250,247,.92);
      --line:#ead9d6;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-width:1120px;
      color:var(--ink);
      font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at 82% 0%, rgba(111,16,39,.16), transparent 31%),
        radial-gradient(circle at 16% 88%, rgba(201,154,69,.16), transparent 28%),
        linear-gradient(135deg,#fff8f2 0%,#f5e7e2 52%,#f9f1eb 100%);
    }
    .shell { display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
    aside {
      width:250px;
      min-width:250px;
      flex:none;
      padding:32px 24px;
      background:
        radial-gradient(circle at 20% 0%, rgba(201,154,69,.18), transparent 32%),
        linear-gradient(180deg,#350713 0%,#1d050b 100%);
      color:white;
      display:flex;
      flex-direction:column;
      gap:0;
    }
    .brand { display:flex; align-items:center; gap:11px; margin-bottom:30px; }
    .logo { width:37px; height:37px; border-radius:12px; background:linear-gradient(135deg,var(--gold),#f0d39a); color:var(--wine-dark); display:grid; place-items:center; font-weight:900; box-shadow:0 10px 22px rgba(0,0,0,.22); }
    .brand strong { display:block; font-size:15px; }
    .brand span { font-size:11px; opacity:.58; }
    .side-title { color:rgba(255,255,255,.5); font-size:10px; font-weight:850; letter-spacing:.12em; margin:8px 0 0; }
    .account-list[aria-label="Preview account list"] { margin-top:1px; }
    .side-sections { margin-top:25px; padding-top:17px; border-top:1px solid rgba(255,255,255,.1); }
    .side-sections .side-title { margin-top:0; margin-bottom:9px; }
    .nav-list,
    .account-list,
    .channel-list { display:grid; gap:6px; }
    .nav-list a,
    .nav-list button,
    .account-list a,
    .account-list button,
    .channel-list a,
    .channel-list button {
      width:100%;
      border:1px solid transparent;
      background:transparent;
      color:rgba(255,255,255,.72);
      padding:11px 12px;
      border-radius:13px;
      min-height:47px;
      text-align:left;
      cursor:pointer;
      font:inherit;
      font-size:12px;
      text-decoration:none;
      display:block;
      transition:none;
    }
    .nav-list button { cursor:default; color:rgba(255,255,255,.72); }
    .nav-list a:hover,
    .nav-list button:hover,
    .account-list a:hover,
    .account-list button:hover,
    .channel-list a:hover,
    .channel-list button:hover { background:transparent; border-color:transparent; color:rgba(255,255,255,.72); }
    .nav-list .active,
    .channel-list .active {
      border-color:rgba(255,255,255,.14);
      background:rgba(255,255,255,.12);
      color:rgba(255,255,255,.72);
    }
    #dashboardNav.active { color:rgba(255,255,255,.72); }
    .account-toggle { display:flex !important; align-items:center; justify-content:space-between; }
    .account-toggle .chevron { opacity:.45; transition:.18s ease; }
    .account-toggle.open .chevron { transform:rotate(90deg); opacity:.9; }
    .nav-list b,
    .account-list b,
    .channel-list b { display:block; font-size:12px; }
    .nav-list small,
    .account-list small,
    .channel-list small { display:block; font-size:9px; opacity:.55; margin-top:4px; }
    .channel-list { margin:2px 0 4px 10px; padding-left:8px; border-left:1px solid rgba(255,255,255,.12); }
    .channel-list[hidden] { display:none !important; }
    .channel-list a,
    .channel-list button { min-height:42px; padding:9px 10px; font-size:11px; color:rgba(255,255,255,.62); }
    aside .nav-list a,
    aside .nav-list button,
    aside .account-list a,
    aside .account-list button,
    aside .channel-list a,
    aside .channel-list button {
      border-color:transparent !important;
      background:transparent !important;
      color:rgba(255,255,255,.72) !important;
      font-size:12px !important;
      transform:none !important;
      box-shadow:none !important;
      transition:none !important;
    }
    aside .nav-list > a,
    aside .nav-list > button,
    aside .account-list > a,
    aside .account-list > button {
      height:57px !important;
      min-height:57px !important;
    }
    aside .channel-list a,
    aside .channel-list button {
      height:45px !important;
      min-height:45px !important;
      font-size:11px !important;
    }
    aside .nav-list a:hover,
    aside .nav-list button:hover,
    aside .account-list a:hover,
    aside .account-list button:hover,
    aside .channel-list a:hover,
    aside .channel-list button:hover {
      border-color:transparent !important;
      background:transparent !important;
      color:rgba(255,255,255,.72) !important;
    }
    aside .nav-list .active,
    aside .account-list .active,
    aside .channel-list .active {
      border-color:transparent !important;
      background:rgba(255,255,255,.12) !important;
      color:rgba(255,255,255,.72) !important;
    }
    .sidebar-tool {
      padding:15px;
      border-radius:18px;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.1);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    }
    .sidebar-tool .tool-kicker { color:#f0d39a; font-size:10px; font-weight:900; letter-spacing:.08em; margin-bottom:8px; }
    .sidebar-tool h2 { margin:0 0 8px; font-size:15px; line-height:1.25; }
    .sidebar-tool p { margin:0 0 12px; color:rgba(255,255,255,.62); font-size:11px; line-height:1.55; }
    .tool-step { display:flex; gap:8px; align-items:flex-start; padding:10px 0; border-top:1px solid rgba(255,255,255,.1); }
    .tool-step:first-of-type { border-top:0; }
    .dot { flex:none; width:20px; height:20px; border-radius:8px; display:grid; place-items:center; background:rgba(240,211,154,.18); color:#f0d39a; font-size:10px; font-weight:900; }
    .tool-step b { display:block; font-size:11px; }
    .tool-step span { display:block; color:rgba(255,255,255,.55); font-size:9px; line-height:1.45; margin-top:3px; }
    main { padding:34px 42px 48px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; }
    h1 { margin:0 0 7px; font-size:30px; letter-spacing:-.045em; color:var(--wine-dark); }
    .sub { color:var(--muted); font-size:13px; line-height:1.55; max-width:760px; }
    .preview-pill { border:1px solid #d8a8b2; border-radius:999px; padding:9px 14px; background:rgba(255,255,255,.76); color:var(--wine); font-size:11px; font-weight:900; white-space:nowrap; }
    .workspace { display:grid; grid-template-columns:.95fr 1.05fr; gap:16px; align-items:start; }
    .card { background:var(--card); border:1px solid rgba(255,255,255,.72); box-shadow:0 18px 48px rgba(64,9,22,.08); border-radius:22px; backdrop-filter:blur(10px); }
    .panel { padding:22px; }
    .panel-head { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:18px; }
    .panel h2 { margin:0 0 5px; font-size:16px; }
    .panel-head span { color:var(--muted); font-size:11px; line-height:1.5; }
    label { display:block; font-size:11px; color:var(--muted); font-weight:800; margin:14px 0 7px; }
    textarea, select, input {
      width:100%;
      border:1px solid var(--line);
      background:rgba(255,255,255,.78);
      color:var(--ink);
      border-radius:14px;
      padding:12px 13px;
      font:inherit;
      outline:0;
    }
    textarea { min-height:260px; resize:vertical; line-height:1.55; }
    textarea:focus, select:focus, input:focus { border-color:#d8a8b2; box-shadow:0 0 0 4px rgba(111,16,39,.08); background:white; }
    .inline { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .actions { display:flex; gap:10px; align-items:center; margin-top:16px; }
    button.primary {
      border:0;
      padding:12px 18px;
      border-radius:999px;
      background:linear-gradient(135deg,var(--wine),#9b2942);
      color:white;
      font:inherit;
      font-size:12px;
      font-weight:950;
      letter-spacing:.06em;
      cursor:pointer;
      box-shadow:0 12px 24px rgba(111,16,39,.2);
    }
    button.secondary {
      border:1px solid #d8a8b2;
      padding:11px 15px;
      border-radius:999px;
      background:rgba(255,255,255,.8);
      color:var(--wine);
      font:inherit;
      font-size:12px;
      font-weight:850;
      cursor:pointer;
    }
    button.primary:disabled { opacity:.68; cursor:wait; box-shadow:none; }
    .sheet-button { display:inline-flex; align-items:center; text-decoration:none; border:1px solid #d8a8b2; border-radius:999px; padding:9px 14px; background:rgba(255,255,255,.86); color:var(--wine); font-size:11px; font-weight:950; white-space:nowrap; }
    .sheet-button:hover { background:white; transform:translateY(-1px); box-shadow:0 9px 22px rgba(111,16,39,.12); }
    .sheet-target {
      padding:14px 16px;
      background:linear-gradient(135deg,#fff7ed,#fff);
      border:1px solid var(--line);
      border-radius:16px;
      color:#5c4247;
      font-size:12px;
      line-height:1.6;
      margin-bottom:14px;
    }
    .sheet-target b { color:var(--wine); }
    .preview-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .field {
      border:1px solid #f0dfdc;
      border-radius:15px;
      padding:12px;
      background:rgba(255,255,255,.62);
      min-height:68px;
    }
    .field.full { grid-column:1 / -1; }
    .field small { display:block; color:var(--muted); font-size:10px; font-weight:850; margin-bottom:6px; }
    .field strong { display:block; font-size:13px; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
    .simple-preview { display:grid; gap:10px; }
    .simple-row { display:grid; grid-template-columns:108px 1fr; gap:12px; align-items:start; padding:12px 13px; border:1px solid #f0dfdc; border-radius:15px; background:rgba(255,255,255,.62); }
    .simple-row small { color:var(--muted); font-size:10px; font-weight:900; }
    .simple-row strong { font-size:13px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
    .sheet-details { margin-top:14px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.5); overflow:hidden; }
    .sheet-details summary { cursor:pointer; padding:12px 14px; color:var(--wine); font-size:12px; font-weight:900; list-style:none; }
    .sheet-details summary::-webkit-details-marker { display:none; }
    .mini-table { width:100%; border-collapse:collapse; margin-top:14px; font-size:12px; overflow:hidden; border-radius:16px; }
    .mini-table th, .mini-table td { text-align:left; padding:10px 12px; border-bottom:1px solid #eee0dc; }
    .mini-table th { color:var(--muted); font-weight:800; background:#fff7f3; }
    .confirmed-panel { margin-top:16px; }
    .confirmed-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:14px; }
    .confirmed-head h2 { margin:0 0 5px; font-size:16px; }
    .confirmed-head span { color:var(--muted); font-size:11px; }
    .confirmed-controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .total-amount {
      padding:10px 13px;
      border-radius:999px;
      background:linear-gradient(135deg,var(--wine),#9b2942);
      color:white;
      font-size:12px;
      font-weight:950;
      box-shadow:0 10px 22px rgba(111,16,39,.18);
      white-space:nowrap;
    }
    .confirmed-date { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; font-weight:850; }
    .confirmed-date input { width:150px; padding:9px 11px; border-radius:999px; font-size:12px; font-weight:800; }
    .order-list { display:grid; gap:10px; }
    .order-item { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:start; padding:14px; border:1px solid #f0dfdc; border-radius:16px; background:rgba(255,255,255,.62); }
    .order-item b { display:block; font-size:13px; margin-bottom:5px; }
    .order-item span { display:block; color:var(--muted); font-size:11px; line-height:1.55; }
    .order-chip { padding:6px 9px; border-radius:999px; background:#f4e4e7; color:var(--wine); font-size:10px; font-weight:950; white-space:nowrap; }
    .empty-orders { padding:16px; border:1px dashed #dfc4c8; border-radius:16px; color:var(--muted); font-size:12px; line-height:1.6; background:rgba(255,255,255,.42); }
    dialog.notice-dialog { width:min(420px,calc(100vw - 36px)); border:0; border-radius:22px; padding:0; color:var(--ink); box-shadow:0 28px 80px rgba(64,9,22,.24); overflow:hidden; }
    dialog.notice-dialog::backdrop { background:rgba(42,6,16,.38); backdrop-filter:blur(3px); }
    .notice-body { padding:26px; text-align:center; background:linear-gradient(135deg,#fff9f5,#fff); }
    .notice-icon { width:48px; height:48px; border-radius:16px; margin:0 auto 14px; display:grid; place-items:center; background:linear-gradient(135deg,var(--wine),#9b2942); color:white; font-size:22px; }
    .notice-body h2 { margin:0 0 8px; font-size:18px; color:var(--wine-dark); }
    .notice-body p { margin:0; color:var(--muted); font-size:13px; line-height:1.6; }
    .notice-body button { margin-top:18px; border:0; border-radius:999px; padding:10px 18px; background:var(--wine); color:white; font:inherit; font-size:12px; font-weight:900; cursor:pointer; }
    /* Sidebar lock: keep the left navigation visually identical on every page. */
    .shell { grid-template-columns:250px minmax(0,1fr) !important; }
    aside {
      width:250px !important;
      min-width:250px !important;
      max-width:250px !important;
      padding:32px 24px !important;
      background:
        radial-gradient(circle at 20% 0%, rgba(201,154,69,.18), transparent 32%),
        linear-gradient(180deg, #350713 0%, #1d050b 100%) !important;
      color:white !important;
      overflow:hidden !important;
    }
    aside, aside * { transition:none !important; animation:none !important; transform:none !important; box-sizing:border-box !important; }
    aside .brand { height:37px !important; margin:0 0 30px !important; gap:11px !important; }
    aside .brand strong { font-size:15px !important; line-height:1.25 !important; color:white !important; }
    aside .brand span { font-size:11px !important; line-height:1.25 !important; color:rgba(255,255,255,.58) !important; }
    aside .account-label,
    aside .side-title { height:12px !important; line-height:12px !important; margin:0 0 9px !important; color:rgba(255,255,255,.48) !important; font-size:10px !important; font-weight:850 !important; letter-spacing:.12em !important; }
    aside .account-list,
    aside .tool-list,
    aside .nav-list { display:grid !important; gap:6px !important; margin:0 !important; }
    aside .side-sections { margin-top:25px !important; padding-top:17px !important; border-top:1px solid rgba(255,255,255,.1) !important; }
    aside .side-button,
    aside .account-list > a,
    aside .account-list > button,
    aside .tool-list > a,
    aside .tool-list > button,
    aside .nav-list > a,
    aside .nav-list > button {
      display:flex !important;
      flex-direction:column !important;
      justify-content:center !important;
      align-items:flex-start !important;
      width:100% !important;
      height:57px !important;
      min-height:57px !important;
      max-height:57px !important;
      margin:0 !important;
      padding:0 12px !important;
      border:1px solid transparent !important;
      border-radius:14px !important;
      background:transparent !important;
      box-shadow:none !important;
      outline:none !important;
      color:rgba(255,255,255,.72) !important;
      text-align:left !important;
      text-decoration:none !important;
      font:inherit !important;
      font-size:12px !important;
      font-weight:850 !important;
      line-height:1.35 !important;
    }
    aside .analysis-toggle,
    aside .account-toggle { flex-direction:row !important; align-items:center !important; justify-content:space-between !important; }
    aside .analysis-toggle > span:first-child,
    aside .account-toggle > span:first-child { display:flex !important; flex-direction:column !important; justify-content:center !important; }
    aside .channel-list {
      display:grid !important;
      gap:6px !important;
      margin:2px 0 4px 10px !important;
      padding-left:8px !important;
      border-left:1px solid rgba(255,255,255,.12) !important;
    }
    aside .channel-list[hidden] { display:none !important; }
    aside .channel-list a,
    aside .channel-list button {
      display:flex !important;
      flex-direction:column !important;
      justify-content:center !important;
      align-items:flex-start !important;
      width:100% !important;
      height:45px !important;
      min-height:45px !important;
      max-height:45px !important;
      margin:0 !important;
      padding:0 10px !important;
      border:1px solid transparent !important;
      border-radius:12px !important;
      background:transparent !important;
      color:rgba(255,255,255,.72) !important;
      text-align:left !important;
      text-decoration:none !important;
      font:inherit !important;
      font-size:11px !important;
      font-weight:850 !important;
      line-height:1.35 !important;
      box-shadow:none !important;
      outline:none !important;
    }
    aside b { color:inherit !important; }
    aside b { display:block !important; margin:0 !important; font-size:12px !important; line-height:1.35 !important; font-weight:900 !important; }
    aside small,
    aside .tool-list a span,
    aside .nav-list small,
    aside .account-list small,
    aside .channel-list small { display:block !important; margin:4px 0 0 !important; color:rgba(255,255,255,.55) !important; font-size:9px !important; line-height:1.25 !important; font-weight:650 !important; opacity:1 !important; }
    aside a:hover,
    aside button:hover,
    aside a:focus,
    aside button:focus { background:transparent !important; border-color:transparent !important; color:rgba(255,255,255,.72) !important; box-shadow:none !important; outline:none !important; }
    aside a.active,
    aside button.active { background:rgba(255,255,255,.12) !important; border-color:transparent !important; color:rgba(255,255,255,.72) !important; box-shadow:none !important; }
    aside #dashboardNav.active b,
    aside #dashboardNav.active small { color:#f0d39a !important; }
  </style>

</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <div class="logo">S</div>
        <div><strong>Scale Story</strong><span>天然胶原蛋白</span></div>
      </div>

      <div>
        <div class="side-title">ANALYSIS</div>
        <div class="account-list" aria-label="Preview account list">
          <button type="button" id="dashboardNav"><b>Dashboard</b><small>3 个 Channel 总统计</small></button>
          <button class="account-toggle" id="analysisToggle" type="button" aria-expanded="false" aria-controls="analysisChannels">
            <span><b>Inbox Analysis</b><small>点开选择 Channel</small></span>
            <span class="chevron">›</span>
          </button>
          <div class="channel-list" id="analysisChannels" hidden>
            <button type="button" data-preview-account="fb108701968299986"><b>Scalestory</b><small>天然胶原蛋白</small></button>
            <button type="button" data-preview-account="fb1177107122151553"><b>鳞记</b><small>Main Front</small></button>
            <button type="button" data-preview-account="fb701760706347255"><b>鳞记 SG</b><small>SG 997 WA</small></button>
          </div>
        </div>
      </div>

      <div class="side-sections">
        <div class="side-title">TOOLS</div>
        <div class="nav-list" aria-label="Dashboard tools">
          <button class="active" type="button"><b>Order Key-In</b><small>Paste order details</small></button>
          <button id="broadcastPlanningNav" type="button"><b>Broadcast Planning</b><small>Broadcast calendar</small></button>
        </div>
      </div>
    </aside>

    <main>
      <header>
        <div>
          <h1>Order Key-In</h1>
          <div class="sub">贴上顾客下单资料，选 Page / Account，确认后记录进单。</div>
        </div>
        <a class="sheet-button" id="sheetButton" href="https://docs.google.com/spreadsheets/d/1py5YznTXAD6TU9onEaa12MXWhLCUngQ5PDSTfD4Q_JQ/edit?gid=1222127904#gid=1222127904">打开 Google Sheet ↗</a>
      </header>

      <section class="workspace">
        <div class="card panel">
          <div class="panel-head">
            <div>
              <h2>Paste Order Details</h2>
              <span>从 ManyChat 复制顾客资料贴进来。</span>
            </div>
          </div>

          <label for="rawInfo">邮寄资料</label>
          <textarea id="rawInfo"></textarea>

          <div class="inline">
            <div>
              <label for="page">Page / Account</label>
              <select id="page">
                <option>Scalestory - 天然胶原蛋白</option>
                <option>鳞记 - 天然胶原蛋白</option>
                <option>鳞记 SG</option>
              </select>
            </div>
            <div>
              <label>自动对应 Channel</label>
              <input id="channelPreview" type="text" value="Knee 990 MC" readonly />
            </div>
          </div>

          <div class="actions">
            <button class="primary" id="confirmPreviewBtn">确认</button>
            <button class="secondary" id="clearBtn">清空</button>
          </div>
        </div>

        <div class="card panel">
          <div class="panel-head">
            <div>
              <h2>Confirm Order</h2>
              <span>确认重点资料后再进单。</span>
            </div>
          </div>

          <div class="sheet-target" id="sheetTarget">
            <b>Google Sheet：</b>Order List<br>
            <b>动作：</b>确认后新增一单
          </div>

          <div class="simple-preview" id="simplePreview"></div>

          <div id="sheetRows" hidden></div>

        </div>
      </section>

      <section class="card panel confirmed-panel" id="confirmedPanel">
        <div class="confirmed-head">
          <div>
            <h2>已确认进单记录</h2>
            <span>根据日期查看当天进单。</span>
          </div>
          <div class="confirmed-controls">
            <div class="total-amount" id="confirmedTotal">Total Amount RM 0</div>
            <div class="confirmed-date">显示日期
              <div class="pill date-control analysis-date-control order-date-control">
                <button id="orderPrevDay" aria-label="前一天" type="button">‹</button>
                <button class="date-label" id="orderDateLabel" type="button" aria-haspopup="true" aria-expanded="false">21/07/2026</button>
                <input id="confirmedDate" type="hidden" />
                <button id="orderNextDay" aria-label="后一天" type="button">›</button>
                <div class="month-popover analysis-date-popover" id="orderDatePopover" hidden>
                  <div class="year-row">
                    <button id="orderDatePrevYear" type="button" aria-label="上一年">‹</button>
                    <strong id="orderDatePickerYear">2026</strong>
                    <button id="orderDateNextYear" type="button" aria-label="下一年">›</button>
                  </div>
                  <div class="month-picker-grid" id="orderDateMonthChoices"></div>
                  <div class="day-picker-grid" id="orderDateDayChoices"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="order-list" id="confirmedOrders"></div>
      </section>
    </main>
  </div>
  <dialog class="notice-dialog" id="noticeDialog">
    <div class="notice-body">
      <div class="notice-icon" id="noticeIcon">✓</div>
      <h2 id="noticeTitle">已确认进单</h2>
      <p id="noticeText">资料已经填进 Google Sheet。</p>
      <button id="noticeClose">OK</button>
    </div>
  </dialog>

  <script>
    const rawInfo = document.getElementById("rawInfo");
    const sheetButton = document.getElementById("sheetButton");
    const channelPreview = document.getElementById("channelPreview");
    const page = document.getElementById("page");
    const simplePreview = document.getElementById("simplePreview");
    const sheetRows = document.getElementById("sheetRows");
    const confirmedPanel = document.getElementById("confirmedPanel");
    const confirmedDate = document.getElementById("confirmedDate");
    const orderDateLabel = document.getElementById("orderDateLabel");
    const orderDatePopover = document.getElementById("orderDatePopover");
    const orderDatePickerYearEl = document.getElementById("orderDatePickerYear");
    const orderDateMonthChoices = document.getElementById("orderDateMonthChoices");
    const orderDateDayChoices = document.getElementById("orderDateDayChoices");
    const confirmedOrders = document.getElementById("confirmedOrders");
    const confirmedTotal = document.getElementById("confirmedTotal");
    const noticeDialog = document.getElementById("noticeDialog");
    const noticeIcon = document.getElementById("noticeIcon");
    const noticeTitle = document.getElementById("noticeTitle");
    const noticeText = document.getElementById("noticeText");
    const dashboardNav = document.getElementById("dashboardNav");
    const analysisToggle = document.getElementById("analysisToggle");
    const analysisChannels = document.getElementById("analysisChannels");
    const orderEntriesKey = "orderSheetConfirmedOrdersV1";
    const apiBase = location.protocol === "file:" ? "http://127.0.0.1:4173" : "";
    const currentPreviewAccount = new URLSearchParams(location.search).get("account") || localStorage.getItem("manychatDashboardAccount") || "";
    let previewOrders = JSON.parse(localStorage.getItem(orderEntriesKey) || "[]");
    let hasConfirmedOrder = false;
    let orderDatePickerYear = new Date().toLocaleString("en", {timeZone:"Asia/Kuala_Lumpur", year:"numeric"});
    let orderDatePickerMonth = new Date().toLocaleString("en", {timeZone:"Asia/Kuala_Lumpur", month:"numeric"});
    function setAnalysisDropdown(open) {
      analysisToggle.classList.toggle("open", open);
      analysisToggle.setAttribute("aria-expanded", String(open));
      analysisChannels.hidden = !open;
    }

    const pageChannelMap = {
      "Scalestory - 天然胶原蛋白": "Knee 990 MC",
      "鳞记 - 天然胶原蛋白": "Main Front",
      "鳞记 SG": "SG 997 WA"
    };
    const orderSheetGids = {
      0: "1376338968",
      1: "1263496879",
      2: "1143781812",
      3: "1289557819",
      4: "1957679479",
      5: "1827266133",
      6: "1222127904"
    };
    const spreadsheetId = "1py5YznTXAD6TU9onEaa12MXWhLCUngQ5PDSTfD4Q_JQ";

    sheetButton.addEventListener("click", event => {
      event.preventDefault();
      window.location.assign(sheetButton.href);
    });

    analysisToggle.addEventListener("click", () => {
      setAnalysisDropdown(analysisChannels.hidden);
    });
    dashboardNav.addEventListener("click", () => {
      window.location.assign("http://127.0.0.1:4173/index.html");
    });
    document.querySelectorAll("[data-preview-account]").forEach(button => {
      button.classList.toggle("active", button.dataset.previewAccount === currentPreviewAccount);
      button.addEventListener("click", () => {
        setAnalysisDropdown(true);
        localStorage.setItem("manychatDashboardAccount", button.dataset.previewAccount);
        window.location.assign(`http://127.0.0.1:4173/index.html?account=${encodeURIComponent(button.dataset.previewAccount)}`);
      });
    });
    setAnalysisDropdown(false);

    function channelForPage() {
      return pageChannelMap[page.value] || "";
    }

    function pick(text, labels) {
      for (const label of labels) {
        const pattern = new RegExp(`${label}\\s*[:：-]?\\s*([^\\n]+)`, "i");
        const found = text.match(pattern);
        if (found?.[1]) return found[1].trim();
      }
      return "";
    }

    function normalizePhone(value) {
      const clean = String(value || "").replace(/[\s()+-]/g, "");
      if (!clean) return "";
      if (/^60/.test(clean) || /^65/.test(clean)) return clean;
      if (/^0/.test(clean)) return `6${clean}`;
      if (/^1\d{8,10}$/.test(clean)) return `60${clean}`;
      if (/^\d{8}$/.test(clean)) return `65${clean}`;
      return clean;
    }

    function normalizePayment(value) {
      const upper = String(value || "").trim().toUpperCase();
      if (!upper) return "";
      if (upper.includes("BNAK")) return "BANK IN";
      if (upper.includes("BANK")) return "BANK IN";
      if (upper.includes("COD")) return "COD";
      return upper;
    }

    function normalizeDate(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";
      const slash = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
      if (slash) {
        const year = slash[3].length === 2 ? `20${slash[3]}` : slash[3];
        return `${slash[1].padStart(2, "0")}/${slash[2].padStart(2, "0")}/${year}`;
      }
      return raw;
    }

    function dateToInputValue(value) {
      const raw = String(value || "").trim();
      const slash = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
      if (slash) {
        const year = slash[3].length === 2 ? `20${slash[3]}` : slash[3];
        return `${year}-${slash[2].padStart(2, "0")}-${slash[1].padStart(2, "0")}`;
      }
      if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
      return "";
    }

    function inputDateToSheetDate(value) {
      const raw = String(value || "").trim();
      const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!iso) return raw;
      return `${iso[3]}/${iso[2]}/${iso[1]}`;
    }

    function formatDateLabel(value) {
      const raw = String(value || "").trim();
      const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!iso) return raw || "选择日期";
      return `${iso[3]}/${iso[2]}/${iso[1]}`;
    }

    function updateOrderDateLabel() {
      orderDateLabel.textContent = formatDateLabel(confirmedDate.value);
    }

    function renderOrderDatePopover() {
      const selected = confirmedDate.value || new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kuala_Lumpur" });
      const [selectedYear, selectedMonth, selectedDay] = selected.split("-").map(Number);
      orderDatePickerYearEl.textContent = orderDatePickerYear;
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      orderDateMonthChoices.innerHTML = months.map((name, index) => {
        const month = index + 1;
        const active = month === Number(orderDatePickerMonth);
        return `<button class="month-choice ${active ? "active" : ""}" data-month="${month}" type="button">${name}</button>`;
      }).join("");
      const daysInMonth = new Date(Number(orderDatePickerYear), Number(orderDatePickerMonth), 0).getDate();
      orderDateDayChoices.innerHTML = Array.from({length: daysInMonth}, (_, index) => {
        const day = index + 1;
        const active = Number(orderDatePickerYear) === selectedYear && Number(orderDatePickerMonth) === selectedMonth && day === selectedDay;
        return `<button class="day-choice ${active ? "active" : ""}" data-day="${day}" type="button">${day}</button>`;
      }).join("");
      orderDateMonthChoices.querySelectorAll("[data-month]").forEach(button => {
        button.onclick = event => {
          event.preventDefault();
          event.stopPropagation();
          orderDatePickerMonth = Number(button.dataset.month);
          renderOrderDatePopover();
        };
      });
      orderDateDayChoices.querySelectorAll("[data-day]").forEach(button => {
        button.onclick = event => {
          event.preventDefault();
          event.stopPropagation();
          setConfirmedDate(`${orderDatePickerYear}-${String(orderDatePickerMonth).padStart(2, "0")}-${String(button.dataset.day).padStart(2, "0")}`);
          closeOrderDatePopover();
          requestAnimationFrame(closeOrderDatePopover);
        };
      });
      orderDateLabel.setAttribute("aria-expanded", String(!orderDatePopover.hidden));
    }

    function setConfirmedDate(value) {
      confirmedDate.value = value;
      orderDatePickerYear = Number(value.slice(0, 4));
      orderDatePickerMonth = Number(value.slice(5, 7));
      updateOrderDateLabel();
      updateSheetButton(confirmedDate.value);
      renderConfirmedOrders();
    }
    function openOrderDatePopover() {
      const selected = confirmedDate.value || new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kuala_Lumpur" });
      orderDatePickerYear = Number(selected.slice(0, 4));
      orderDatePickerMonth = Number(selected.slice(5, 7));
      orderDatePopover.hidden = false;
      renderOrderDatePopover();
    }
    function toggleOrderDatePopover() {
      if (orderDatePopover.hidden) openOrderDatePopover();
      else {
        orderDatePopover.hidden = true;
        orderDateLabel.setAttribute("aria-expanded", "false");
      }
    }
    function closeOrderDatePopover() {
      orderDatePopover.hidden = true;
      orderDateLabel.setAttribute("aria-expanded", "false");
    }

    function shiftConfirmedDate(days) {
      const base = confirmedDate.value || new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kuala_Lumpur" });
      const date = new Date(`${base}T12:00:00`);
      date.setDate(date.getDate() + days);
      setConfirmedDate(date.toISOString().slice(0, 10));
    }

    function monthIndexFromSheetDate(value) {
      const raw = String(value || "").trim();
      const slash = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
      if (slash) return Number(slash[2]) - 1;
      const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (iso) return Number(iso[2]) - 1;
      return new Date().toLocaleString("en", {timeZone:"Asia/Kuala_Lumpur", month:"numeric"}) - 1;
    }

    function updateSheetButton(dateValue) {
      const monthIndex = monthIndexFromSheetDate(dateValue);
      const gid = orderSheetGids[monthIndex] || orderSheetGids[new Date().getMonth()] || "1222127904";
      sheetButton.href = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/edit?gid=${gid}#gid=${gid}`;
    }

    function amountToRM(value, text) {
      const raw = String(value || "").trim();
      if (!raw) return "";
      const number = Number(raw.replace(/[^0-9.]/g, ""));
      if (!Number.isFinite(number)) return raw;
      if (/SGD|S\$/i.test(raw) || /SGD|S\$/i.test(text)) return String(number * 3);
      return String(number);
    }

    function extractReceipt(text) {
      return pick(text, ["receipt", "收据", "付款证明"]) || (text.match(/https?:\/\/\S+/i)?.[0] || "");
    }

    function cleanLines(text) {
      return String(text || "")
        .split(/\n+/)
        .map(line => line.trim())
        .filter(Boolean);
    }

    function inferLooseOrder(text) {
      const lines = cleanLines(text);
      const urls = lines.filter(line => /^https?:\/\//i.test(line));
      const phoneLine = lines.find(line => /(?:\+?6?0)?1[0-9][\s-]?[0-9]{3,4}[\s-]?[0-9]{4}/.test(line)) || "";
      const amountLine = lines.find(line => /(?:RM|SGD|S\$)\s*\d+(?:\.\d{1,2})?/i.test(line)) || "";
      const paymentLine = lines.find(line => /\b(BANK\s*IN|BANKIN|BANK|COD|TNG|TOUCH\s*N\s*GO|FPX)\b/i.test(line)) || "";
      const productLine = lines.find(line =>
        /\b(?:BOX|BTL|BOTTLE|盒|瓶)\b/i.test(line) ||
        /\b(?:CLASSIC|LYCHEE|LONGAN|OSMANTHUS|PASSION\s*FRUIT|GINSENG|LEMON\s*GRASS|LEMONGRASS|FLORAL|GIFT\s*BOX)\b/i.test(line)
      ) || "";
      const used = new Set([phoneLine, amountLine, paymentLine, productLine, ...urls].filter(Boolean));
      const candidates = lines.filter(line => !used.has(line));
      const name = candidates[0] || "";
      const address = candidates.slice(name ? 1 : 0).join("\n");
      return { name, phone: phoneLine, amount: amountLine, payment: paymentLine, product: productLine, receipt: urls[0] || "", address };
    }

    function productQuantities(productText) {
      const source = String(productText || "").toUpperCase();
      const totals = { classic: 0, knee: 0, ginseng: 0, floral: 0 };
      const segments = source.split(/[,+，\n]/).map(x => x.trim()).filter(Boolean);
      const classify = (part) => {
        if (/GINSENG/.test(part)) return "ginseng";
        if (/LEMON\s*GRASS|LEMONGRASS/.test(part)) return "knee";
        if (/FLORAL/.test(part)) return "floral";
        if (/CLASSIC|LYCHEE|LONGAN|OSMANTHUS|PASSION\s*FRUIT|GIFT\s*BOX/.test(part)) return "classic";
        return "";
      };
      const addQuantity = (part) => {
        const kind = classify(part);
        if (!kind) return;
        const boxMatches = [...part.matchAll(/(\d+(?:\.\d+)?)\s*(?:BOX|盒)/g)];
        const btlMatches = [...part.matchAll(/(\d+(?:\.\d+)?)\s*(?:BTL|BOTTLE|瓶)/g)];
        let added = false;
        for (const match of boxMatches) {
          const multiplier = /GIFT\s*BOX/.test(part) ? 6 : 12;
          totals[kind] += Number(match[1]) * multiplier;
          added = true;
        }
        for (const match of btlMatches) {
          totals[kind] += Number(match[1]);
          added = true;
        }
        if (!added) {
          const loose = part.match(/^(\d+(?:\.\d+)?)/);
          if (loose) totals[kind] += Number(loose[1]);
        }
      };
      segments.forEach(addQuantity);
      const variantParts = [];
      const totalBoxes = [...source.matchAll(/(\d+(?:\.\d+)?)\s*(?:BOX|盒)/g)].reduce((sum, match) => sum + Number(match[1]), 0);
      const totalBtl = [...source.matchAll(/(\d+(?:\.\d+)?)\s*(?:BTL|BOTTLE|瓶)/g)].reduce((sum, match) => sum + Number(match[1]), 0);
      if (totalBoxes) variantParts.push(`${totalBoxes} BOX`);
      if (totalBtl) variantParts.push(`${totalBtl} BTL`);
      return { totals, variant: variantParts.join(" + ") };
    }

    function parseOrder() {
      const text = rawInfo.value.trim();
      const loose = inferLooseOrder(text);
      const phone = pick(text, ["电话", "手机号", "phone", "tel", "contact"]) || loose.phone || (text.match(/(?:\\+?6?0)?1[0-9][\\s-]?[0-9]{3,4}[\\s-]?[0-9]{4}/)?.[0] || "");
      const amount = pick(text, ["金额", "总额", "价格", "amount", "total"]) || loose.amount || (text.match(/(?:RM|SGD|S\$)\s*\d+(?:\.\d{1,2})?/i)?.[0] || "");
      const product = pick(text, ["产品", "商品", "item", "product"]) || loose.product;
      const quantities = productQuantities(product);
      const payment = normalizePayment(pick(text, ["付款", "付款方式", "payment", "payment method"]) || loose.payment);
      const name = pick(text, ["姓名", "名字", "name"]) || loose.name;
      const platformName = pick(text, ["Platform Name", "平台名", "fb name", "manychat name"]) || name;
      const remarkBits = [
        product,
        pick(text, ["备注", "note", "remark"]),
        /SGD|S\$/i.test(amount) ? amount : ""
      ].filter(Boolean);
      const parsed = {
        "D · Sales Person": "Joey",
        "E · NO": "正式写入时自动接下一单号",
        "F · Date": normalizeDate(pick(text, ["日期", "date"])) || "待确认",
        "G · Platform Name": platformName || "",
        "H · Channel / Chanel": channelForPage(),
        "I · Classic BTL": quantities.totals.classic || "-",
        "J · Knee BTL": quantities.totals.knee || "-",
        "K · Ginseng BTL": quantities.totals.ginseng || "-",
        "L · Floral BTL": quantities.totals.floral || "-",
        "M · Payment Method": payment,
        "N · Variant": quantities.variant,
        "O · Remark": remarkBits.join(", "),
        "P · Name": name || "",
        "Q · Phone": normalizePhone(phone),
        "R · Address": pick(text, ["地址", "邮寄地址", "address"]) || loose.address || "",
        "S · Total/RM": amountToRM(amount, text),
        "AK · Receipt Link": extractReceipt(text) || loose.receipt
      };
      return parsed;
    }

    function render() {
      channelPreview.value = channelForPage();
      const data = parseOrder();
      if (!rawInfo.value.trim()) {
        simplePreview.innerHTML = "";
        sheetRows.innerHTML = "";
        if (!confirmedDate.value) confirmedDate.value = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kuala_Lumpur" });
        updateOrderDateLabel();
        updateSheetButton(confirmedDate.value);
        return;
      }
      if (!confirmedDate.value) confirmedDate.value = dateToInputValue(data["F · Date"]) || new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kuala_Lumpur" });
      updateOrderDateLabel();
      updateSheetButton(data["F · Date"] === "待确认" ? confirmedDate.value : data["F · Date"]);
      const productLine = [
        data["I · Classic BTL"] !== "-" ? `Classic ${data["I · Classic BTL"]} BTL` : "",
        data["J · Knee BTL"] !== "-" ? `Knee ${data["J · Knee BTL"]} BTL` : "",
        data["K · Ginseng BTL"] !== "-" ? `Ginseng ${data["K · Ginseng BTL"]} BTL` : "",
        data["L · Floral BTL"] !== "-" ? `Floral ${data["L · Floral BTL"]} BTL` : ""
      ].filter(Boolean).join(" · ") || "待确认";
      const simpleRows = [
        ["顾客", data["P · Name"] || "待确认"],
        ["电话", data["Q · Phone"] || "待确认"],
        ["地址", data["R · Address"] || "待确认"],
        ["产品", productLine],
        ["金额 / 付款", `${data["S · Total/RM"] || "待确认"}${data["M · Payment Method"] ? ` · ${data["M · Payment Method"]}` : ""}`],
        ["Page / Channel", `${page.value} → ${data["H · Channel / Chanel"]}`],
        ["备注", data["O · Remark"] || "—"],
        ["Receipt", data["AK · Receipt Link"] || "—"]
      ];
      simplePreview.innerHTML = simpleRows.map(([key, value]) => `
        <div class="simple-row">
          <small>${key}</small>
          <strong>${value}</strong>
        </div>
      `).join("");
      sheetRows.innerHTML = Object.entries(data).map(([key, value]) => `<tr><td>${key}</td><td>${value || "—"}</td></tr>`).join("");
    }

    function showNotice(type, title, text) {
      noticeIcon.textContent = type === "error" ? "!" : "✓";
      noticeTitle.textContent = title;
      noticeText.textContent = text;
      noticeDialog.showModal();
    }

    function buildOrderRecord(data, response = {}) {
      const productLine = [
        data["I · Classic BTL"] !== "-" ? `Classic ${data["I · Classic BTL"]} BTL` : "",
        data["J · Knee BTL"] !== "-" ? `Knee ${data["J · Knee BTL"]} BTL` : "",
        data["K · Ginseng BTL"] !== "-" ? `Ginseng ${data["K · Ginseng BTL"]} BTL` : "",
        data["L · Floral BTL"] !== "-" ? `Floral ${data["L · Floral BTL"]} BTL` : ""
      ].filter(Boolean).join(" · ") || "待确认";
      const sheetDate = data["F · Date"] === "待确认" ? inputDateToSheetDate(confirmedDate.value) : data["F · Date"];
      return {
        id: response.id || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        sheet: response.sheet || "",
        row: response.row || "",
        no: response.no || "",
        date: sheetDate,
        dateKey: dateToInputValue(sheetDate) || confirmedDate.value,
        name: data["P · Name"] || "待确认",
        phone: data["Q · Phone"] || "",
        product: productLine,
        total: data["S · Total/RM"] || "",
        payment: data["M · Payment Method"] || "",
        page: page.value,
        channel: data["H · Channel / Chanel"]
      };
    }

    async function confirmOrder() {
      const data = parseOrder();
      if (data["F · Date"] === "待确认") {
        data["F · Date"] = inputDateToSheetDate(confirmedDate.value || new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kuala_Lumpur" }));
      }
      const button = document.getElementById("confirmPreviewBtn");
      button.disabled = true;
      button.textContent = "保存中…";
      try {
        const response = await fetch(`${apiBase}/api/order-entry`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ page: page.value, raw: rawInfo.value, order: data })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) throw new Error(result.error || "写入 Google Sheet 失败");
        const order = buildOrderRecord(data, result.entry || {});
        previewOrders = [order, ...previewOrders];
        localStorage.setItem(orderEntriesKey, JSON.stringify(previewOrders));
        hasConfirmedOrder = true;
        setConfirmedDate(order.dateKey);
        const sheetText = order.sheet ? `「${order.sheet}」` : "Google Sheet";
        const rowText = order.row ? `Row ${order.row}` : "指定 row";
        showNotice("success", "已确认进单", `资料已经成功填进 ${sheetText}，位置：${rowText}。`);
      } catch (error) {
        showNotice("error", "进单失败", error.message || "暂时无法写入 Google Sheet。");
      } finally {
        button.disabled = false;
        button.textContent = "确认";
      }
    }

    function renderConfirmedOrders() {
      if (!hasConfirmedOrder) {
        confirmedTotal.hidden = false;
        confirmedTotal.textContent = "Total Amount RM 0";
        confirmedOrders.innerHTML = `<div class="empty-orders">确认进单后，这里会显示当天订单记录和 Total Amount。</div>`;
        return;
      }
      const selected = confirmedDate.value;
      const items = previewOrders.filter(order => order.dateKey === selected);
      const totalAmount = items.reduce((sum, order) => {
        const amount = Number(String(order.total || "").replace(/[^0-9.]/g, ""));
        return sum + (Number.isFinite(amount) ? amount : 0);
      }, 0);
      confirmedTotal.textContent = `Total Amount RM ${totalAmount.toLocaleString("en-MY", { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
      confirmedOrders.innerHTML = items.length
        ? items.map(order => `
          <div class="order-item">
            <div>
              <b>${order.name} ${order.phone ? `· ${order.phone}` : ""}</b>
              <span>${order.product}</span>
              <span>${order.page} → ${order.channel}</span>
            </div>
            <div class="order-chip">RM ${order.total || "—"}${order.payment ? ` · ${order.payment}` : ""}</div>
          </div>
        `).join("")
        : `<div class="empty-orders">这个日期还没有确认进单记录。正式版会在订单成功写入 Google Sheet 后自动显示在这里。</div>`;
    }

    document.getElementById("confirmPreviewBtn").addEventListener("click", confirmOrder);
    document.getElementById("broadcastPlanningNav").addEventListener("click", () => {
      window.location.href = "http://127.0.0.1:4173/broadcast-planning-preview.html";
    });
    document.getElementById("noticeClose").addEventListener("click", () => noticeDialog.close());
    document.getElementById("clearBtn").addEventListener("click", () => {
      rawInfo.value = "";
      render();
    });
    rawInfo.addEventListener("input", render);
    page.addEventListener("change", render);
    confirmedDate.addEventListener("change", () => {
      updateOrderDateLabel();
      updateSheetButton(confirmedDate.value);
      renderConfirmedOrders();
    });
    document.getElementById("orderPrevDay").addEventListener("click", event => {
      event.stopPropagation();
      shiftConfirmedDate(-1);
      openOrderDatePopover();
    });
    document.getElementById("orderNextDay").addEventListener("click", event => {
      event.stopPropagation();
      shiftConfirmedDate(1);
      openOrderDatePopover();
    });
    orderDateLabel.addEventListener("click", event => {
      event.stopPropagation();
      openOrderDatePopover();
    });
    document.querySelector(".order-date-control").addEventListener("click", event => {
      if (event.target.closest("#orderPrevDay, #orderNextDay, #orderDatePopover, #orderDateLabel")) return;
      event.stopPropagation();
      openOrderDatePopover();
    });
    document.addEventListener("pointerdown", event => {
      if (!event.target.closest(".order-date-control") || event.target.closest("#orderDatePopover")) return;
      if (event.target.closest("#orderPrevDay, #orderNextDay")) return;
      openOrderDatePopover();
    }, true);
    document.getElementById("orderDatePrevYear").addEventListener("click", event => {
      event.stopPropagation();
      orderDatePickerYear = Number(orderDatePickerYear) - 1;
      renderOrderDatePopover();
    });
    document.getElementById("orderDateNextYear").addEventListener("click", event => {
      event.stopPropagation();
      orderDatePickerYear = Number(orderDatePickerYear) + 1;
      renderOrderDatePopover();
    });
    orderDateMonthChoices.addEventListener("click", event => {
      const button = event.target.closest("[data-month]");
      if (!button) return;
      orderDatePickerMonth = Number(button.dataset.month);
      renderOrderDatePopover();
    });
    orderDateDayChoices.addEventListener("click", event => {
      const button = event.target.closest("[data-day]");
      if (!button) return;
      setConfirmedDate(`${orderDatePickerYear}-${String(orderDatePickerMonth).padStart(2, "0")}-${String(button.dataset.day).padStart(2, "0")}`);
          closeOrderDatePopover();
          requestAnimationFrame(closeOrderDatePopover);
    });
    orderDatePopover.addEventListener("pointerdown", event => {
      const monthButton = event.target.closest("#orderDateMonthChoices [data-month]");
      if (monthButton) {
        event.preventDefault();
        event.stopPropagation();
        orderDatePickerMonth = Number(monthButton.dataset.month);
        renderOrderDatePopover();
        return;
      }
      const dayButton = event.target.closest("#orderDateDayChoices [data-day]");
      if (dayButton) {
        event.preventDefault();
        event.stopPropagation();
        setConfirmedDate(`${orderDatePickerYear}-${String(orderDatePickerMonth).padStart(2, "0")}-${String(dayButton.dataset.day).padStart(2, "0")}`);
          closeOrderDatePopover();
          requestAnimationFrame(closeOrderDatePopover);
      }
    }, true);
    document.addEventListener("click", event => {
      if (!orderDatePopover.hidden && !event.target.closest(".order-date-control")) {
        orderDatePopover.hidden = true;
        orderDateLabel.setAttribute("aria-expanded", "false");
      }
    });
    render();
    renderConfirmedOrders();
  </script>
</body>
</html>
