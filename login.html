<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scale Story Dashboard · Login</title>
  <style>
    :root {
      --espresso:#33251b;
      --griotte:#41140e;
      --oat:#f2dece;
      --blue:#adbcc3;
      --cream:#fff8f1;
      --ink:#2a1713;
      --muted:#78665e;
      --line:rgba(65,20,14,.16);
      --card:rgba(255,248,241,.82);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      color:var(--ink);
      font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at 18% 8%, rgba(242,222,206,.92), transparent 34%),
        radial-gradient(circle at 83% 18%, rgba(173,188,195,.58), transparent 30%),
        radial-gradient(circle at 70% 92%, rgba(65,20,14,.38), transparent 42%),
        linear-gradient(135deg, #d8d9d5 0%, #f2dece 48%, #8c7970 100%);
    }
    .login-card {
      width:min(440px, 100%);
      padding:34px;
      border:1px solid rgba(255,255,255,.52);
      border-radius:34px;
      background:linear-gradient(145deg, rgba(255,248,241,.92), rgba(242,222,206,.82));
      box-shadow:0 28px 80px rgba(51,37,27,.24);
      backdrop-filter:blur(16px);
    }
    .brand { display:flex; align-items:center; gap:14px; margin-bottom:28px; }
    .logo {
      width:50px;
      height:50px;
      border-radius:18px;
      display:grid;
      place-items:center;
      color:#fff8f1;
      background:linear-gradient(135deg, var(--griotte), var(--espresso));
      font-weight:900;
      letter-spacing:.02em;
    }
    h1 { margin:0; font-size:28px; line-height:1.05; color:var(--griotte); }
    p { margin:8px 0 0; color:var(--muted); font-size:14px; line-height:1.6; }
    label { display:block; margin:16px 0 7px; font-size:12px; font-weight:850; color:var(--griotte); letter-spacing:.03em; }
    input {
      width:100%;
      border:1px solid var(--line);
      border-radius:18px;
      padding:15px 16px;
      background:rgba(255,255,255,.58);
      color:var(--ink);
      outline:none;
      font:inherit;
      font-weight:700;
    }
    input:focus { border-color:rgba(65,20,14,.38); box-shadow:0 0 0 4px rgba(173,188,195,.22); }
    button {
      width:100%;
      margin-top:22px;
      border:0;
      border-radius:20px;
      padding:15px 18px;
      color:#fff8f1;
      background:linear-gradient(135deg, var(--griotte), var(--espresso));
      font:inherit;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 15px 38px rgba(65,20,14,.24);
    }
    .message { min-height:22px; margin-top:14px; color:#7a231f; font-size:13px; font-weight:750; text-align:center; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>Scale Story</h1>
        <p>Login to continue your dashboard.</p>
      </div>
    </div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="your@email.com" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Login</button>
      <div class="message" id="message" role="status"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "/";
    fetch("/api/auth/status", { cache: "no-store" })
      .then(response => response.json())
      .then(data => {
        if (!data.enabled) message.textContent = "Login 还没启用：请先设置 AUTH_PASSWORD。";
        if (data.authenticated) location.href = next;
        if (data.email) document.getElementById("email").value = data.email;
      })
      .catch(() => {});
    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "Checking...";
      const payload = {
        email: form.email.value,
        password: form.password.value
      };
      const response = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        message.textContent = data.error || "Login failed.";
        return;
      }
      location.href = next;
    });
  </script>
</body>
</html>
