<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharmacy Search</title>
  <script>if (new URLSearchParams(location.search).get('embedded') === '1') document.documentElement.classList.add('embedded-frame');</script>
  <style>
    :root{--ink:#351b18;--muted:#82675f;--wine:#64151c;--wine-dark:#3a1110;--line:rgba(117,67,57,.2);--card:rgba(255,249,244,.78)}
    *{box-sizing:border-box}body{margin:0;min-width:850px;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:radial-gradient(circle at 84% 4%,rgba(255,244,232,.48),transparent 29%),radial-gradient(circle at 8% 92%,rgba(249,216,184,.24),transparent 26%),linear-gradient(135deg,#f2dfcf 0%,#c29786 48%,#6c3029 100%)}main{max-width:1180px;margin:auto;padding:38px 42px 56px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}h1{margin:0 0 7px;font-size:31px;letter-spacing:-.045em;color:var(--wine-dark)}.sub{font-size:13px;color:var(--muted);line-height:1.55}.card{background:linear-gradient(135deg,rgba(255,250,246,.92),rgba(239,218,202,.78));border:1px solid rgba(255,255,255,.54);box-shadow:0 18px 48px rgba(64,20,14,.18),inset 0 1px 0 rgba(255,255,255,.55);border-radius:22px;padding:22px;backdrop-filter:blur(13px)}label{display:block;color:var(--muted);font-size:11px;font-weight:850;margin:0 0 7px}input,select,textarea{width:100%;border:1px solid var(--line);background:rgba(255,251,247,.75);border-radius:13px;padding:12px 13px;color:var(--ink);font:inherit;outline:0;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#d8a8b2;box-shadow:0 0 0 4px rgba(111,16,39,.08);background:#fff}.primary,.secondary{border:0;border-radius:999px;font:inherit;font-size:12px;font-weight:850;cursor:pointer}.primary{padding:12px 19px;color:#fff8f2;background:linear-gradient(135deg,#4b1013,#9d2740);box-shadow:0 10px 24px rgba(78,13,20,.24)}.secondary{padding:9px 13px;color:var(--wine);background:rgba(255,249,245,.84);border:1px solid rgba(146,52,61,.34)}.editor{margin-bottom:18px}.editor[hidden]{display:none}.editor-grid{display:grid;grid-template-columns:1fr 190px;gap:12px}.editor-grid .wide{grid-column:1/-1}.editor-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.search-card{display:grid;grid-template-columns:250px 1fr auto;gap:14px;align-items:end}.search-field{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.search-field .primary{padding:9px 13px}.result-head{display:flex;justify-content:space-between;align-items:flex-end;margin:27px 0 12px}.result-head h2{margin:0 0 5px;font-size:20px}.result-tools{display:flex;align-items:center;gap:8px}.count,.copy-all{display:none}.count{padding:7px 10px;border-radius:999px;background:rgba(100,21,28,.1);color:var(--wine);font-size:11px;font-weight:900}.count.show,.copy-all.show{display:block}.copy-all{padding:10px 14px}.results{display:grid;gap:11px}.empty{padding:24px;border:1px dashed rgba(117,67,57,.32);border-radius:17px;color:var(--muted);font-size:13px;background:rgba(255,251,247,.48)}.pharmacy{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:19px 20px;border-radius:19px;border:1px solid rgba(117,67,57,.16);background:rgba(255,252,248,.72);box-shadow:0 8px 20px rgba(81,30,24,.06)}.pharmacy:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,#d8ac7a,#7b1d2f);opacity:.8}.pharmacy-main{min-width:0}.pharmacy-title{display:flex;align-items:center;gap:9px;margin-bottom:10px}.pharmacy h3{margin:0;font-size:17px;letter-spacing:-.02em}.pill{padding:4px 8px;border-radius:999px;background:rgba(100,21,28,.09);color:var(--wine);font-size:10px;font-weight:900;white-space:nowrap}.detail{font-size:12px;color:#644d47;line-height:1.55;margin:4px 0}.pharmacy-actions{display:flex;align-self:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.copy{color:#fff9f3;background:linear-gradient(135deg,#4b1013,#862036);border-color:transparent;padding:10px 14px}.edit{padding:10px 12px}.toast{position:fixed;right:24px;bottom:24px;color:white;background:linear-gradient(135deg,#3a1110,#7b1d2f);padding:11px 15px;border-radius:999px;font-size:12px;font-weight:750;box-shadow:0 12px 28px rgba(35,5,12,.28);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:980px){main{padding:28px 24px}.page-head,.search-card,.editor-grid{grid-template-columns:1fr;display:grid}.pharmacy{grid-template-columns:1fr}.pharmacy-actions{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header class="page-head"><div><h1>Pharmacy Search</h1><div class="sub">Search any pharmacy detail, then copy it in the original Google Sheet format.</div></div><button class="primary" id="showEditor" type="button">+ Add Pharmacy</button></header>
    <section class="card editor" id="editor" hidden>
      <form id="pharmacyForm"><div class="editor-grid">
        <div><label for="formName">Pharmacy Name</label><input id="formName" required /></div>
        <div><label for="formState">State</label><input id="formState" list="stateOptions" placeholder="e.g. Johor" /></div>
        <div class="wide"><label for="formAddress">Address</label><textarea id="formAddress" rows="2" required placeholder="59A, Jalan …"></textarea></div>
        <div><label for="formHours">Operating Hours</label><input id="formHours" placeholder="Mon–Sun 9am–9pm" /></div>
        <div><label for="formPhone">Contact Number</label><input id="formPhone" placeholder="6012…" /></div>
      </div><datalist id="stateOptions"></datalist><div class="editor-actions"><button class="secondary" id="cancelEditor" type="button">Cancel</button><button class="primary" type="submit" id="savePharmacy">Save Pharmacy</button></div></form>
    </section>
    <section class="card search-card">
      <div><label for="state">State</label><select id="state"><option value="">All states</option></select></div>
      <div class="search-field"><div><label for="keyword">Search pharmacy details</label><input id="keyword" placeholder="Name, state, postcode, address or phone…" /></div><button class="primary" id="search">Search</button></div>
      <button class="secondary" type="button" id="clear">Clear</button>
    </section>
    <div class="result-head"><div><h2>Search Result</h2><div class="sub">Copy keeps the pharmacy name, emoji, address, operating hours and contact number.</div></div><div class="result-tools"><div class="count" id="count"></div><button class="primary copy-all" id="copyAll" type="button">Copy All Results</button></div></div>
    <section class="card"><div class="results" id="results"><div class="empty">Search by pharmacy name, state, postcode, address, opening hours or phone number.</div></div></section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="pharmacy-library.js"></script>
  <script>
  (()=>{
    const STORAGE_KEY='scale_story_pharmacy_library';
    let list=(()=>{try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'');return Array.isArray(saved)&&saved.length?saved:(window.PHARMACY_LIBRARY||[])}catch{return window.PHARMACY_LIBRARY||[]}})();
    const $=id=>document.getElementById(id),state=$('state'),keyword=$('keyword'),results=$('results'),count=$('count'),copyAll=$('copyAll'),editor=$('editor'),form=$('pharmacyForm'),esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)};
    let matched=[],editingId='';
    const withoutLabel=(value,label)=>String(value||'').replace(new RegExp('^[📍🕐📞]?\\s*'+label+'\\s*[:：]?\\s*','iu'),'').trim();
    const line=(prefix,label,value)=>{const clean=withoutLabel(value,label);return clean?prefix+label+': '+clean:''};
    const details=item=>[item.name,item.address,item.hours,item.phone].filter(Boolean).join('\n');
    const persist=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(list));
    function states(){const selected=state.value,values=[...new Set(list.map(item=>item.state).filter(Boolean))].sort();state.innerHTML='<option value="">All states</option>'+values.map(name=>'<option value="'+esc(name)+'">'+esc(name)+'</option>').join('');state.value=values.includes(selected)?selected:'';$('stateOptions').innerHTML=values.map(name=>'<option value="'+esc(name)+'"></option>').join('')}
    function copyText(text,message){navigator.clipboard.writeText(text).then(()=>toast(message)).catch(()=>prompt('Copy pharmacy details:',text))}
    function showEditor(item){editingId=item?.id||'';form.reset();$('savePharmacy').textContent=item?'Save Changes':'Save Pharmacy';if(item){$('formName').value=item.name||'';$('formState').value=item.state||'';$('formAddress').value=withoutLabel(item.address,'Address');$('formHours').value=withoutLabel(item.hours,'Operating Hours');$('formPhone').value=withoutLabel(item.phone,'Contact number')}editor.hidden=false;$('formName').focus();editor.scrollIntoView({behavior:'smooth',block:'center'})}
    function hideEditor(){editingId='';form.reset();editor.hidden=true}
    function render(){const selected=state.value,query=keyword.value.trim().toLowerCase();if(!selected&&!query){matched=[];results.innerHTML='<div class="empty">Search by pharmacy name, state, postcode, address, opening hours or phone number.</div>';count.classList.remove('show');copyAll.classList.remove('show');return}matched=list.filter(item=>{const searchable=[item.name,item.state,item.postcode,item.address,item.hours,item.phone].join(' ').toLowerCase();return(!selected||item.state===selected)&&(!query||searchable.includes(query))});count.textContent=matched.length+' pharmacie'+(matched.length===1?'':'s')+' found';count.classList.add('show');copyAll.classList.toggle('show',matched.length>0);results.innerHTML=matched.length?matched.map(item=>'<article class="pharmacy"><div class="pharmacy-main"><div class="pharmacy-title"><h3>'+esc(item.name)+'</h3><span class="pill">'+esc(item.state||'State unavailable')+(item.postcode?' · '+esc(item.postcode):'')+'</span></div><div class="detail">'+esc(item.address)+'</div><div class="detail">'+esc(item.hours)+'</div><div class="detail">'+esc(item.phone)+'</div></div><div class="pharmacy-actions"><button class="secondary copy" data-copy="'+esc(item.id)+'">Copy Details</button><button class="secondary edit" data-edit="'+esc(item.id)+'">Edit</button></div></article>').join(''):'<div class="empty">No pharmacy found. Try another keyword or state.</div>';results.querySelectorAll('[data-copy]').forEach(button=>button.onclick=()=>{const item=list.find(x=>x.id===button.dataset.copy);copyText(item.details||details(item),'Pharmacy details copied')});results.querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>showEditor(list.find(x=>x.id===button.dataset.edit)))}
    $('showEditor').onclick=()=>showEditor();$('cancelEditor').onclick=hideEditor;copyAll.onclick=()=>{if(matched.length)copyText(matched.map(item=>item.details||details(item)).join('\n\n'),'All '+matched.length+' pharmacy details copied')};$('search').onclick=render;$('clear').onclick=()=>{state.value='';keyword.value='';render()};keyword.addEventListener('keydown',event=>{if(event.key==='Enter')render()});state.onchange=render;
    form.onsubmit=event=>{event.preventDefault();const address=line('📍','Address',$('formAddress').value),hours=line('🕐','Operating Hours',$('formHours').value),phone=line('📞','Contact number',$('formPhone').value),postcode=(address.match(/\b\d{5}\b/)||[''])[0],item={id:editingId||'pharmacy_local_'+Date.now(),name:$('formName').value.trim(),state:$('formState').value.trim(),address,hours,phone,postcode};item.details=details(item);const index=list.findIndex(x=>x.id===item.id);if(index>=0)list[index]=item;else list.unshift(item);persist();states();hideEditor();render();toast(index>=0?'Pharmacy updated':'Pharmacy added')};
    states();render();
  })()
  </script>
</body>
</html>
