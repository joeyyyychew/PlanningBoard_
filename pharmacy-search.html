<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharmacy Search</title>
  <script>if (new URLSearchParams(location.search).get('embedded') === '1') document.documentElement.classList.add('embedded-frame');</script>
  <style>
    :root{--ink:#351b18;--muted:#82675f;--wine:#64151c;--wine-dark:#3a1110;--line:rgba(117,67,57,.2);--card:rgba(255,249,244,.78)}
    *{box-sizing:border-box}body{margin:0;min-width:850px;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:radial-gradient(circle at 84% 4%,rgba(255,244,232,.48),transparent 29%),radial-gradient(circle at 8% 92%,rgba(249,216,184,.24),transparent 26%),linear-gradient(135deg,#f2dfcf 0%,#c29786 48%,#6c3029 100%)}main{max-width:1180px;margin:auto;padding:38px 42px 56px}header{margin-bottom:22px}h1{margin:0 0 7px;font-size:31px;letter-spacing:-.045em;color:var(--wine-dark)}.sub{font-size:13px;color:var(--muted);line-height:1.55}.card{background:linear-gradient(135deg,rgba(255,250,246,.92),rgba(239,218,202,.78));border:1px solid rgba(255,255,255,.54);box-shadow:0 18px 48px rgba(64,20,14,.18),inset 0 1px 0 rgba(255,255,255,.55);border-radius:22px;padding:22px;backdrop-filter:blur(13px)}label{display:block;color:var(--muted);font-size:11px;font-weight:850;margin:0 0 7px}input,select{width:100%;border:1px solid var(--line);background:rgba(255,251,247,.75);border-radius:13px;padding:12px 13px;color:var(--ink);font:inherit;outline:0}input:focus,select:focus{border-color:#d8a8b2;box-shadow:0 0 0 4px rgba(111,16,39,.08);background:#fff}.primary,.secondary{border:0;border-radius:999px;font:inherit;font-size:12px;font-weight:850;cursor:pointer}.primary{padding:12px 19px;color:#fff8f2;background:linear-gradient(135deg,#4b1013,#9d2740);box-shadow:0 10px 24px rgba(78,13,20,.24)}.secondary{padding:9px 13px;color:var(--wine);background:rgba(255,249,245,.84);border:1px solid rgba(146,52,61,.34)}.search-card{display:grid;grid-template-columns:250px 1fr auto;gap:14px;align-items:end}.search-field{display:grid;grid-template-columns:1fr auto;gap:10px}.result-head{display:flex;justify-content:space-between;align-items:flex-end;margin:27px 0 12px}.result-head h2{margin:0 0 5px;font-size:20px}.count{display:none;padding:7px 10px;border-radius:999px;background:rgba(100,21,28,.1);color:var(--wine);font-size:11px;font-weight:900}.count.show{display:block}.results{display:grid;gap:11px}.empty{padding:24px;border:1px dashed rgba(117,67,57,.32);border-radius:17px;color:var(--muted);font-size:13px;background:rgba(255,251,247,.48)}.pharmacy{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:19px 20px;border-radius:19px;border:1px solid rgba(117,67,57,.16);background:rgba(255,252,248,.72);box-shadow:0 8px 20px rgba(81,30,24,.06)}.pharmacy:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,#d8ac7a,#7b1d2f);opacity:.8}.pharmacy-main{min-width:0}.pharmacy-title{display:flex;align-items:center;gap:9px;margin-bottom:10px}.pharmacy h3{margin:0;font-size:17px;letter-spacing:-.02em}.pill{padding:4px 8px;border-radius:999px;background:rgba(100,21,28,.09);color:var(--wine);font-size:10px;font-weight:900;white-space:nowrap}.detail{font-size:12px;color:#644d47;line-height:1.55;margin:4px 0}.pharmacy-actions{display:flex;align-self:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.copy{color:#fff9f3;background:linear-gradient(135deg,#4b1013,#862036);border-color:transparent;padding:10px 14px}.toast{position:fixed;right:24px;bottom:24px;color:white;background:linear-gradient(135deg,#3a1110,#7b1d2f);padding:11px 15px;border-radius:999px;font-size:12px;font-weight:750;box-shadow:0 12px 28px rgba(35,5,12,.28);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:980px){main{padding:28px 24px}.search-card{grid-template-columns:1fr}.pharmacy{grid-template-columns:1fr}.pharmacy-actions{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header><h1>Pharmacy Search</h1><div class="sub">Search any pharmacy detail, then copy it in the original Google Sheet format.</div></header>
    <section class="card search-card">
      <div><label for="state">State</label><select id="state"><option value="">All states</option></select></div>
      <div class="search-field"><div><label for="keyword">Search pharmacy details</label><input id="keyword" placeholder="Name, state, postcode, address or phone…" /></div><button class="primary" id="search">Search</button></div>
      <button class="secondary" type="button" id="clear">Clear</button>
    </section>
    <div class="result-head"><div><h2>Search Result</h2><div class="sub">Copy keeps the pharmacy name, emoji, address, operating hours and contact number.</div></div><div class="count" id="count"></div></div>
    <section class="card"><div class="results" id="results"><div class="empty">Search by pharmacy name, state, postcode, address, opening hours or phone number.</div></div></section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="pharmacy-library.js"></script>
  <script>
  (()=>{const list=window.PHARMACY_LIBRARY||[],state=document.getElementById('state'),keyword=document.getElementById('keyword'),results=document.getElementById('results'),count=document.getElementById('count'),esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)};[...new Set(list.map(item=>item.state).filter(Boolean))].sort().forEach(name=>state.insertAdjacentHTML('beforeend','<option value="'+esc(name)+'">'+esc(name)+'</option>'));function copy(item){navigator.clipboard.writeText(item.details).then(()=>toast('Pharmacy details copied')).catch(()=>prompt('Copy pharmacy details:',item.details))}function render(){const selected=state.value,query=keyword.value.trim().toLowerCase();if(!selected&&!query){results.innerHTML='<div class="empty">Search by pharmacy name, state, postcode, address, opening hours or phone number.</div>';count.classList.remove('show');return}const matched=list.filter(item=>{const searchable=[item.name,item.state,item.postcode,item.address,item.hours,item.phone].join(' ').toLowerCase();return(!selected||item.state===selected)&&(!query||searchable.includes(query))});count.textContent=matched.length+' pharmacie'+(matched.length===1?'':'s')+' found';count.classList.add('show');results.innerHTML=matched.length?matched.map(item=>'<article class="pharmacy"><div class="pharmacy-main"><div class="pharmacy-title"><h3>'+esc(item.name)+'</h3><span class="pill">'+esc(item.state||'State unavailable')+(item.postcode?' · '+esc(item.postcode):'')+'</span></div><div class="detail">'+esc(item.address)+'</div><div class="detail">'+esc(item.hours)+'</div><div class="detail">'+esc(item.phone)+'</div></div><div class="pharmacy-actions"><button class="secondary copy" data-copy="'+esc(item.id)+'">Copy Details</button><button class="secondary" data-address="'+esc(item.id)+'">Copy Address</button><a class="secondary" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(item.address.replace(/^📍\s*Address:\s*/i,''))+'" target="_blank" rel="noopener">Open Map ↗</a></div></article>').join(''):'<div class="empty">No pharmacy found. Try another keyword or state.</div>';results.querySelectorAll('[data-copy]').forEach(button=>button.onclick=()=>copy(list.find(item=>item.id===button.dataset.copy)));results.querySelectorAll('[data-address]').forEach(button=>button.onclick=()=>{const item=list.find(x=>x.id===button.dataset.address);navigator.clipboard.writeText(item.address).then(()=>toast('Address copied')).catch(()=>prompt('Copy address:',item.address))})}document.getElementById('search').onclick=render;document.getElementById('clear').onclick=()=>{state.value='';keyword.value='';render()};keyword.addEventListener('keydown',event=>{if(event.key==='Enter')render()});state.onchange=render})()
  </script>
</body>
</html>
