<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Links</title>
  <script>if (new URLSearchParams(location.search).get('embedded') === '1') document.documentElement.classList.add('embedded-frame');</script>
  <style>
    :root{--ink:#2a1419;--muted:#8f7379;--wine:#6f1027;--wine-dark:#2a0610;--rose:#b94f62;--cream:#fbf4ef;--card:rgba(255,250,247,.9);--line:#ead9d6}
    *{box-sizing:border-box} body{margin:0;min-width:880px;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:radial-gradient(circle at 80% 0%,rgba(111,16,39,.16),transparent 31%),radial-gradient(circle at 15% 90%,rgba(201,154,69,.16),transparent 28%),linear-gradient(135deg,#fff8f2 0%,#f5e7e2 52%,#f9f1eb 100%)}
    main{max-width:1180px;margin:auto;padding:38px 42px 56px} header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}h1{margin:0 0 7px;font-size:31px;letter-spacing:-.045em;color:var(--wine-dark)}.sub{font-size:13px;color:var(--muted);line-height:1.55}.card{background:var(--card);border:1px solid rgba(255,255,255,.76);box-shadow:0 18px 48px rgba(64,9,22,.08);border-radius:22px;padding:22px;backdrop-filter:blur(10px)}.card h2{margin:0 0 5px;font-size:17px}.card p{margin:0;color:var(--muted);font-size:12px}.primary,.secondary,.icon{border:0;border-radius:999px;font:inherit;font-size:12px;font-weight:850;cursor:pointer}.primary{padding:11px 17px;color:white;background:linear-gradient(135deg,var(--wine),#a21d40);box-shadow:0 10px 24px rgba(111,16,39,.18)}.secondary{padding:10px 15px;color:var(--wine);background:rgba(255,255,255,.82);border:1px solid #d8a8b2}.icon{width:34px;height:34px;color:var(--wine);background:#fff7f2;border:1px solid #e7c9c7}.primary:disabled,.secondary:disabled{opacity:.48;cursor:not-allowed}.search-card{display:grid;grid-template-columns:245px 1fr;gap:18px;align-items:end;margin-bottom:18px}.tabs{display:flex;gap:7px}.tab{border:1px solid var(--line);background:#fff9f5;color:var(--muted);border-radius:999px;padding:10px 15px;font:inherit;font-size:12px;font-weight:850;cursor:pointer}.tab.active{color:white;background:var(--wine);border-color:var(--wine)}label{display:block;color:var(--muted);font-size:11px;font-weight:850;margin:0 0 7px}input,select{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:13px;padding:12px 13px;color:var(--ink);font:inherit;outline:0}input:focus,select:focus{border-color:#d8a8b2;box-shadow:0 0 0 4px rgba(111,16,39,.08);background:#fff}.search-box{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.result-area{margin-top:17px;display:grid;gap:9px}.empty{padding:22px;border:1px dashed #dcc9c4;border-radius:15px;color:var(--muted);font-size:12px;background:rgba(255,255,255,.42)}.result{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:14px;background:rgba(255,255,255,.72)}.amount{min-width:110px;color:var(--wine);font-size:18px;font-weight:900}.link-url{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#725861;font-size:12px}.actions{display:flex;gap:7px}.library-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:26px 0 12px}.filters{display:flex;gap:7px;align-items:center}.filters select{width:120px;padding:9px 11px}.library{display:grid;gap:8px}.row{display:grid;grid-template-columns:115px 1fr auto;gap:14px;align-items:center;padding:13px 14px;border-radius:15px;background:rgba(255,255,255,.68);border:1px solid var(--line)}.row .amount{font-size:14px}.form{display:none;grid-template-columns:130px 130px 1fr auto;gap:10px;align-items:end;margin-bottom:12px}.form.open{display:grid}.form .cancel{display:none}.form.editing .cancel{display:inline-block}.notice{margin-top:12px;font-size:12px;color:var(--muted)}.error{color:#9d1532}.toast{position:fixed;right:24px;bottom:24px;color:white;background:#351019;padding:11px 15px;border-radius:999px;font-size:12px;font-weight:750;box-shadow:0 12px 28px rgba(35,5,12,.28);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:980px){main{padding:28px 24px}.search-card{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.form input{grid-column:span 2}.row{grid-template-columns:105px 1fr}.row .actions{grid-column:2}.result{grid-template-columns:105px 1fr}.result .actions{grid-column:2}}
    /* Match the established warm wine-and-cream dashboard palette. */
    :root{--ink:#351b18;--muted:#82675f;--wine:#64151c;--wine-dark:#3a1110;--card:rgba(255,249,244,.78);--line:rgba(117,67,57,.2)}
    body{background:radial-gradient(circle at 84% 4%,rgba(255,244,232,.48),transparent 29%),radial-gradient(circle at 8% 92%,rgba(249,216,184,.24),transparent 26%),linear-gradient(135deg,#f2dfcf 0%,#c29786 48%,#6c3029 100%)}
    .card{background:linear-gradient(135deg,rgba(255,250,246,.92),rgba(239,218,202,.78));border-color:rgba(255,255,255,.54);box-shadow:0 18px 48px rgba(64,20,14,.18),inset 0 1px 0 rgba(255,255,255,.55);backdrop-filter:blur(13px)}
    .primary{color:#fff8f2;background:linear-gradient(135deg,#4b1013,#9d2740);box-shadow:0 10px 24px rgba(78,13,20,.24)}
    .secondary{background:rgba(255,249,245,.84);border-color:rgba(146,52,61,.34)}.icon{border-color:rgba(146,52,61,.26)}
    .tab{background:rgba(255,249,245,.72)}.tab.active{background:linear-gradient(135deg,#4b1013,#8d2339);border-color:transparent}
    input,select{background:rgba(255,251,247,.75);border-color:rgba(117,67,57,.2)}
    .empty{border-color:rgba(117,67,57,.32);background:rgba(255,251,247,.48)}.result,.row{border-color:rgba(117,67,57,.16);background:rgba(255,252,248,.67)}
    .toast{background:linear-gradient(135deg,#3a1110,#7b1d2f)}
  </style>
</head>
<body>
  <main>
    <header><div><h1>Payment Links</h1><div class="sub">Search, copy and manage payment links stored in your Dashboard.</div></div><button class="primary" id="showForm">+ Add Payment Link</button></header>
    <section class="card search-card"><div><label>Currency</label><div class="tabs" id="currencyTabs"><button class="tab active" data-currency="MYR">MYR</button><button class="tab" data-currency="SGD">SGD</button><button class="tab" data-currency="HKD">HKD</button></div></div><div class="search-box"><div><label for="searchAmount">Search by amount</label><input id="searchAmount" inputmode="decimal" placeholder="e.g. 584" /></div><button class="primary" id="searchButton">Search</button></div></section>
    <section class="card"><h2>Search Result</h2><p>Enter the exact amount to find a saved payment link.</p><div class="result-area" id="results"><div class="empty">Choose a currency and enter an amount to search.</div></div></section>
    <div class="library-head"><div><h2 style="margin:0 0 5px">Link Library</h2><div class="sub">All payment links saved in the Dashboard.</div></div><div class="filters"><label for="libraryCurrency" style="margin:0">Show</label><select id="libraryCurrency"><option value="ALL">All currencies</option><option value="MYR">MYR</option><option value="SGD">SGD</option><option value="HKD">HKD</option></select></div></div>
    <section class="card"><form class="form" id="linkForm"><div><label for="formCurrency">Currency</label><select id="formCurrency"><option>MYR</option><option>SGD</option><option>HKD</option></select></div><div><label for="formAmount">Amount</label><input id="formAmount" inputmode="decimal" required placeholder="584" /></div><div><label for="formUrl">Payment Link</label><input id="formUrl" type="url" required placeholder="https://..." /></div><div class="actions"><button class="secondary cancel" type="button" id="cancelEdit">Cancel</button><button class="primary" type="submit" id="saveLink">Save</button></div></form><div class="library" id="library"><div class="empty">Loading payment links…</div></div><div class="notice" id="notice"></div></section>
  </main>
  <div class="toast" id="toast"></div>
  <script>
  (()=>{
    const state={links:[],currency:'MYR',editingId:''};
    const apiBase=location.protocol==='file:'?'http://127.0.0.1:4173':'';
    const $=id=>document.getElementById(id), money=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
    const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
    async function api(url,options){const res=await fetch(apiBase+url,options);const body=await res.json().catch(()=>({}));if(!res.ok||!body.ok)throw new Error(body.error||'Unable to save payment link');return body}
    function renderResults(){const raw=$('searchAmount').value.trim();const amount=Number(raw.replace(/[^0-9.]/g,''));const target=$('results');if(!raw){target.innerHTML='<div class="empty">Choose a currency and enter an amount to search.</div>';return}if(!Number.isFinite(amount)||amount<=0){target.innerHTML='<div class="empty error">Please enter a valid amount.</div>';return}const matched=state.links.filter(link=>link.currency===state.currency&&Number(link.amount)===amount);if(!matched.length){target.innerHTML='<div class="empty">No saved '+state.currency+' payment link for '+esc(money(amount))+'. You can add one below.</div>';return}target.innerHTML=matched.map(link=>`<div class="result"><div class="amount">${link.currency} ${esc(money(link.amount))}</div><div class="link-url" title="${esc(link.url)}">${esc(link.url)}</div><div class="actions"><button class="secondary" data-copy="${esc(link.id)}">Copy</button><a class="secondary" href="${esc(link.url)}" target="_blank" rel="noopener">Open ↗</a></div></div>`).join('');target.querySelectorAll('[data-copy]').forEach(button=>button.onclick=()=>copy(button.dataset.copy));}
    function renderLibrary(){const filter=$('libraryCurrency').value;const links=state.links.filter(link=>filter==='ALL'||link.currency===filter);$('library').innerHTML=links.length?links.map(link=>`<div class="row"><div class="amount">${link.currency} ${esc(money(link.amount))}</div><div class="link-url" title="${esc(link.url)}">${esc(link.url)}</div><div class="actions"><button class="secondary" data-edit="${esc(link.id)}">Edit</button><button class="icon" aria-label="Delete payment link" data-delete="${esc(link.id)}">×</button></div></div>`).join(''):'<div class="empty">No payment links in this currency yet.</div>';$('library').querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>edit(button.dataset.edit));$('library').querySelectorAll('[data-delete]').forEach(button=>button.onclick=()=>remove(button.dataset.delete));$('notice').textContent=state.links.length?`${state.links.length} payment link${state.links.length===1?'':'s'} saved in Dashboard.`:'';}
    async function copy(id){const link=state.links.find(item=>item.id===id);if(!link)return;try{await navigator.clipboard.writeText(link.url);toast('Payment link copied')}catch{prompt('Copy this payment link:',link.url)}}
    function showForm(editing=false){$('linkForm').classList.add('open');$('linkForm').classList.toggle('editing',editing);$('showForm').textContent=editing?'Editing Payment Link':' + Add Payment Link';$('formAmount').focus()}
    function resetForm(){state.editingId='';$('linkForm').reset();$('formCurrency').value=state.currency;$('linkForm').classList.remove('editing','open');$('showForm').textContent='+ Add Payment Link'}
    function edit(id){const link=state.links.find(item=>item.id===id);if(!link)return;state.editingId=id;$('formCurrency').value=link.currency;$('formAmount').value=link.amount;$('formUrl').value=link.url;showForm(true);$('linkForm').scrollIntoView({behavior:'smooth',block:'center'})}
    async function remove(id){const link=state.links.find(item=>item.id===id);if(!link||!confirm(`Delete ${link.currency} ${money(link.amount)} payment link?`))return;try{await api('/api/payment-links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',id})});state.links=state.links.filter(item=>item.id!==id);renderLibrary();renderResults();toast('Payment link deleted')}catch(err){toast(err.message)}}
    async function load(){try{const data=await api('/api/payment-links');state.links=data.links||[];renderLibrary();renderResults()}catch(err){$('library').innerHTML='<div class="empty error">'+esc(err.message)+'</div>';$('results').innerHTML='<div class="empty error">Unable to load payment links.</div>'}}
    $('currencyTabs').addEventListener('click',event=>{const button=event.target.closest('[data-currency]');if(!button)return;state.currency=button.dataset.currency;$('currencyTabs').querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===button));$('formCurrency').value=state.currency;renderResults()});$('searchButton').onclick=renderResults;$('searchAmount').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();renderResults()}});$('libraryCurrency').onchange=renderLibrary;$('showForm').onclick=()=>{if($('linkForm').classList.contains('open'))resetForm();else showForm(false)};$('cancelEdit').onclick=resetForm;
    $('linkForm').onsubmit=async event=>{event.preventDefault();const payload={id:state.editingId,currency:$('formCurrency').value,amount:$('formAmount').value,url:$('formUrl').value};try{const data=await api('/api/payment-links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const index=state.links.findIndex(item=>item.id===data.link.id);if(index>=0)state.links[index]=data.link;else state.links.push(data.link);resetForm();renderLibrary();renderResults();toast(index>=0?'Payment link updated':'Payment link saved')}catch(err){toast(err.message)}};
    load();
  })();
  </script>
</body>
</html>
