<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bundle Templates</title>
  <script>if(new URLSearchParams(location.search).get('embedded')==='1')document.documentElement.classList.add('embedded-frame')</script>
  <style>
    :root{--ink:#351b18;--muted:#82675f;--wine:#64151c;--line:rgba(117,67,57,.2)}*{box-sizing:border-box}body{margin:0;min-width:800px;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:radial-gradient(circle at 84% 4%,rgba(255,244,232,.48),transparent 29%),linear-gradient(135deg,#f2dfcf 0%,#c29786 48%,#6c3029 100%)}main{max-width:1120px;margin:auto;padding:38px 42px 60px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}h1{margin:0 0 7px;font-size:31px;letter-spacing:-.045em;color:#3a1110}.sub{font-size:13px;color:var(--muted);line-height:1.55}.card{padding:22px;border:1px solid rgba(255,255,255,.56);border-radius:22px;background:linear-gradient(135deg,rgba(255,250,246,.92),rgba(239,218,202,.78));box-shadow:0 18px 48px rgba(64,20,14,.18)}label{display:block;margin:0 0 7px;color:var(--muted);font-size:11px;font-weight:850}input,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:rgba(255,251,247,.8);color:var(--ink);font:inherit;outline:0}textarea{min-height:112px;resize:vertical}input:focus,textarea:focus{border-color:#d8a8b2;box-shadow:0 0 0 4px rgba(111,16,39,.08)}.primary,.secondary,.icon{border:0;border-radius:999px;font:inherit;font-size:12px;font-weight:850;cursor:pointer}.primary{padding:12px 19px;color:#fff8f2;background:linear-gradient(135deg,#4b1013,#9d2740);box-shadow:0 10px 24px rgba(78,13,20,.24)}.secondary{padding:9px 13px;color:var(--wine);border:1px solid rgba(146,52,61,.34);background:rgba(255,249,245,.84)}.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.library-head{display:flex;justify-content:space-between;align-items:end;margin:28px 0 12px}.library-head h2{margin:0 0 5px;font-size:20px}.count{padding:7px 10px;border-radius:999px;background:rgba(100,21,28,.1);color:var(--wine);font-size:11px;font-weight:900}.list{display:grid;gap:11px}.bundle{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:18px 20px;border-radius:18px;border:1px solid rgba(117,67,57,.16);background:rgba(255,252,248,.74)}.bundle:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,#d8ac7a,#7b1d2f)}.bundle h3{margin:0 0 7px;font-size:17px}.amount{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:rgba(100,21,28,.1);color:var(--wine);font-size:11px;font-weight:900}.details{white-space:pre-wrap;color:#644d47;font-size:12px;line-height:1.55}.bundle-actions{display:flex;align-items:center;gap:8px}.empty{padding:26px;border:1px dashed rgba(117,67,57,.32);border-radius:17px;color:var(--muted);font-size:13px;background:rgba(255,251,247,.48)}.toast{position:fixed;right:24px;bottom:24px;padding:11px 15px;border-radius:999px;color:#fff;background:#54121a;font-size:12px;font-weight:800;opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:900px){main{padding:28px 24px}.form-grid,.head{display:grid;grid-template-columns:1fr}.bundle{grid-template-columns:1fr}.bundle-actions{justify-content:flex-start}}
  </style>
</head>
<body>
  <main>
    <header class="head"><div><h1>Bundle Templates</h1><div class="sub">Set up a bundle once, then apply it from any Order Key-In card. Each applied order remains editable.</div></div><button class="primary" id="add" type="button">+ Add Bundle</button></header>
    <section class="card" id="editor" hidden><form id="form"><div class="form-grid"><div><label for="name">Bundle Name</label><input id="name" required placeholder="e.g. RM1399 Bundle" /></div><div><label for="amount">Amount (RM)</label><input id="amount" inputmode="decimal" required placeholder="1399" /></div><div class="wide"><label for="details">Bundle Details / Remark</label><textarea id="details" required placeholder="6 BOX CLASSIC + 2 BOX FLORAL + 6 BTL COLLAGEN DRINKS + 10 COLLAGEN BOWL + 20PCS MASK"></textarea></div></div><div class="actions"><button class="secondary" type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save Bundle</button></div></form></section>
    <div class="library-head"><div><h2>Saved Bundles</h2><div class="sub">Templates are stored in this Dashboard and do not change past orders.</div></div><span class="count" id="count">0 bundles</span></div>
    <section class="card"><div class="list" id="list"></div></section>
  </main><div class="toast" id="toast"></div>
  <script>
  (()=>{const KEY='scale_story_bundle_templates',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&gt;','>':'&lt;',"'":'&#39;','"':'&quot;'}[c])),load=()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}},save=()=>localStorage.setItem(KEY,JSON.stringify(items)),toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};let items=load(),editing='';function render(){items.sort((a,b)=>Number(b.updatedAt||0)-Number(a.updatedAt||0));$('count').textContent=items.length+' bundle'+(items.length===1?'':'s');$('list').innerHTML=items.length?items.map(x=>'<article class="bundle"><div><h3>'+esc(x.name)+'<span class="amount">RM '+esc(x.amount)+'</span></h3><div class="details">'+esc(x.details)+'</div></div><div class="bundle-actions"><button class="secondary" data-edit="'+esc(x.id)+'">Edit</button><button class="secondary" data-delete="'+esc(x.id)+'">Delete</button></div></article>').join(''):'<div class="empty">No bundle saved yet. Add your first bundle to use it in Order Key-In.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(items.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const x=items.find(x=>x.id===b.dataset.delete);if(x&&confirm('Delete '+x.name+'?')){items=items.filter(x=>x.id!==b.dataset.delete);save();render();toast('Bundle deleted')}})}function open(x){editing=x?.id||'';$('form').reset();if(x){$('name').value=x.name;$('amount').value=x.amount;$('details').value=x.details}$('editor').hidden=false;$('name').focus()}function close(){editing='';$('form').reset();$('editor').hidden=true}$('add').onclick=()=>open();$('cancel').onclick=close;$('form').onsubmit=e=>{e.preventDefault();const next={id:editing||'bundle_'+Date.now(),name:$('name').value.trim(),amount:$('amount').value.trim(),details:$('details').value.trim(),updatedAt:Date.now()};const i=items.findIndex(x=>x.id===next.id);if(i<0)items.unshift(next);else items[i]=next;save();close();render();toast(i<0?'Bundle saved':'Bundle updated')};render()})()
  </script>
</body></html>
